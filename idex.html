<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#86B27B">
<title>Loro Vocab</title>
<style>
:root{--bg:#f5f8f3;--panel:#fff;--text:#243027;--muted:#6f7d72;--line:#dbe7d7;--primary:#86B27B;--primary-dark:#628a59;--soft:#edf5ea;--good:#2f7d4a;--bad:#c85d5d;--shadow:0 18px 45px rgba(65,92,59,.13)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(134,178,123,.28),transparent 32%),linear-gradient(180deg,#fcfefb 0%,var(--bg) 100%)}button{font:inherit}
.app{max-width:820px;margin:auto;padding:18px 16px 48px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow)}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;cursor:pointer}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}.hidden{display:none!important}.pill{display:inline-flex;background:var(--soft);color:var(--primary-dark);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;margin-bottom:14px}.hero h1{font-size:34px;line-height:1.2;margin:0 0 10px}.hero p{margin:0;color:var(--muted);line-height:1.7}.section-title{font-size:15px;font-weight:900;margin:24px 0 10px}
.day-grid,.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.day-btn,.mode-btn,.review-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;cursor:pointer;text-align:left;color:var(--text)}.day-btn.active,.mode-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent}.day-btn strong,.mode-btn strong{display:block;font-size:16px;margin-bottom:4px}.day-btn span,.mode-btn span{font-size:12px;opacity:.8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.primary,.secondary{border-radius:17px;padding:14px 16px;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#fbfdfb;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.stat strong{display:block;font-size:21px}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.status{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}
.review-list{display:grid;gap:10px}.review-card{display:flex;justify-content:space-between;align-items:center}.review-card small{display:block;color:var(--muted);margin-top:4px}.progress-track{height:10px;background:#edf3eb;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary-dark))}.quiz-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.question-card{text-align:center;padding:30px 12px 20px}.direction{font-size:12px;color:var(--muted);margin-bottom:10px}.prompt{font-size:clamp(34px,8vw,62px);font-weight:900;word-break:keep-all}.pos-badge{display:inline-block;margin-top:11px;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--primary-dark);font-weight:850;font-size:14px}
.options{display:grid;gap:11px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--text);padding:16px;border-radius:17px;cursor:pointer;line-height:1.5}.option.correct{background:#e8f5e9;border-color:var(--good);color:#225b35}.option.wrong{background:#fff0f0;border-color:var(--bad);color:#8b3030}.feedback{min-height:30px;margin:16px 0 8px;text-align:center;font-weight:850}.result-score{text-align:center;font-size:56px;font-weight:900;margin:8px 0}.result-sub{text-align:center;color:var(--muted);margin-bottom:20px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.checks label{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center}.wrong-list{display:grid;gap:9px;margin:14px 0 18px}.wrong-item{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px}.wrong-main small{color:var(--primary-dark);font-weight:800}.wrong-item span{text-align:right;color:var(--muted);font-size:14px}
@media(max-width:620px){.day-grid,.mode-grid,.actions,.checks{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:18px;border-radius:22px}.hero h1{font-size:29px}.wrong-item{grid-template-columns:1fr}.wrong-item span{text-align:left}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="logo">L</div><span>Loro Vocab</span></div><button id="resetBtn" class="icon-btn">↻</button></header>

<section id="home" class="panel">
<div class="hero"><div class="pill">🌿 Google Sheet 연동</div><h1>학습하고,<br>원하는 Day를 예약 복습해요.</h1><p>영어→한국어, 한국어→영어, 랜덤 모드를 지원합니다.</p></div>
<div class="section-title">학습할 Day</div><div id="dayGrid" class="day-grid"></div>
<div class="section-title">학습 모드</div>
<div class="mode-grid">
<button class="mode-btn active" data-mode="en-ko"><strong>영어 → 한국어</strong><span>영단어 뜻 고르기</span></button>
<button class="mode-btn" data-mode="ko-en"><strong>한국어 → 영어</strong><span>뜻에 맞는 단어 고르기</span></button>
<button class="mode-btn" data-mode="random"><strong>랜덤</strong><span>두 방향 섞어서 출제</span></button>
</div>
<div class="actions"><button id="startBtn" class="primary">학습 시작</button><button id="wrongBtn" class="secondary">오답만 복습</button></div>
<div class="section-title">오늘 복습</div><div id="reviewList" class="review-list"></div>
<div class="stats"><div class="stat"><strong id="plays">0</strong><span>학습 횟수</span></div><div class="stat"><strong id="answeredTotal">0</strong><span>푼 문제</span></div><div class="stat"><strong id="accuracy">0%</strong><span>누적 정답률</span></div><div class="stat"><strong id="reviewDone">0</strong><span>복습 완료</span></div></div>
<div id="sheetStatus" class="status">구글시트에서 단어를 불러오는 중입니다…</div>
</section>

<section id="quiz" class="panel hidden">
<div class="progress-track"><div id="progress" class="progress-bar"></div></div><div class="quiz-meta"><span id="counter"></span><span id="score"></span></div>
<div class="question-card"><div id="direction" class="direction"></div><div id="prompt" class="prompt"></div><div id="pos" class="pos-badge"></div></div>
<div id="options" class="options"></div><div id="feedback" class="feedback"></div>
<button id="nextBtn" class="primary hidden" style="width:100%">다음 문제</button><button id="homeBtn" class="secondary" style="width:100%;margin-top:10px">학습 종료</button>
</section>

<section id="result" class="panel hidden">
<div class="pill">🎉 학습 완료</div><div id="resultScore" class="result-score"></div><div id="resultText" class="result-sub"></div>
<div id="reviewScheduler"><div class="section-title">이 Day를 언제 복습할까요?</div><div class="checks"><label><input type="checkbox" value="1" checked> 내일</label><label><input type="checkbox" value="3"> 3일 후</label><label><input type="checkbox" value="7"> 7일 후</label></div><button id="saveReviewBtn" class="secondary" style="width:100%">복습 일정 저장</button></div>
<div class="section-title">틀린 항목</div><div id="wrongList" class="wrong-list"></div>
<div class="actions"><button id="againBtn" class="primary">같은 범위 다시</button><button id="resultHomeBtn" class="secondary">메인으로</button></div>
</section>
</main>

<script>
const SHEET_ID="1pqkxifp5vpkQiY7B7j6WK8LAHyPGl66s", SHEET_GID="502706340";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
const fallbackEntries=[{"day": 9, "word": "contrary", "pos": "형용사", "meaning": "반대의"}, {"day": 9, "word": "contrast", "pos": "명사", "meaning": "대조, 대비"}, {"day": 9, "word": "contrast", "pos": "동사", "meaning": "대조하다"}, {"day": 9, "word": "counterfeit", "pos": "형용사", "meaning": "위조의, 가짜의"}, {"day": 9, "word": "counterfeit", "pos": "명사", "meaning": "위조품, 가짜"}, {"day": 9, "word": "counterfeit", "pos": "동사", "meaning": "위조하다"}, {"day": 10, "word": "geography", "pos": "명사", "meaning": "지리학"}, {"day": 10, "word": "geometry", "pos": "명사", "meaning": "기하학"}, {"day": 10, "word": "unique", "pos": "형용사", "meaning": "유일한, 독특한"}, {"day": 10, "word": "balance", "pos": "명사", "meaning": "균형"}, {"day": 10, "word": "balance", "pos": "동사", "meaning": "균형을 잡다"}, {"day": 10, "word": "trivial", "pos": "형용사", "meaning": "사소한, 하찮은"}];
let entries=[];
const state={selected:"all",mode:localStorage.getItem("loroMode")||"en-ko",quiz:[],index:0,score:0,wrong:[],activeDay:null,isReview:false,reviewSchedule:null,currentDirection:"en-ko"};
const $=id=>document.getElementById(id), keyOf=x=>`${x.day}|${x.word}|${x.pos}`;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function todayKey(){return new Date().toISOString().slice(0,10)} function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f);f=""}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=""}else if(c!=='\r')f+=c}}if(f.length||row.length){row.push(f);rows.push(row)}return rows}
function normalize(csv){const r=parseCSV(csv);if(r.length<2)return[];const h=r[0].map(v=>v.trim()),i={day:h.indexOf("Day"),word:h.indexOf("영단어"),pos:h.indexOf("품사"),meaning:h.indexOf("뜻"),use:h.indexOf("사용")};return r.slice(1).map(x=>({day:Number((x[i.day]||"").trim()),word:(x[i.word]||"").trim(),pos:(x[i.pos]||"").trim(),meaning:(x[i.meaning]||"").trim(),use:i.use>=0?(x[i.use]||"Y").trim().toUpperCase():"Y"})).filter(x=>x.day&&x.word&&x.pos&&x.meaning&&x.use!=="N")}
async function loadEntries(){try{const res=await fetch(SHEET_URL+`&t=${Date.now()}`,{cache:"no-store"});if(!res.ok)throw 0;entries=normalize(await res.text());if(entries.length<4)throw 0;$("sheetStatus").textContent=`구글시트와 연결됨 · 총 ${entries.length}개 항목`}catch(e){entries=fallbackEntries;$("sheetStatus").textContent=`구글시트를 읽지 못해 내장 단어 ${entries.length}개 사용 중`}renderDays();renderReviews()}
function renderDays(){const c={};entries.forEach(x=>c[x.day]=(c[x.day]||0)+1);const g=$("dayGrid");g.innerHTML="";Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(d=>{const b=document.createElement("button");b.className="day-btn";b.dataset.day=d;b.innerHTML=`<strong>DAY ${String(d).padStart(2,"0")}</strong><span>${c[d]}개 항목</span>`;b.onclick=()=>selectDay(b);g.appendChild(b)});const all=document.createElement("button");all.className="day-btn active";all.dataset.day="all";all.innerHTML=`<strong>전체 학습</strong><span>${entries.length}개 항목</span>`;all.onclick=()=>selectDay(all);g.appendChild(all);state.selected="all"}
function selectDay(b){state.selected=b.dataset.day;document.querySelectorAll(".day-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
document.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;localStorage.setItem("loroMode",state.mode);document.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x===b))});
function renderMode(){document.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.mode===state.mode))}
function stats(){const s=JSON.parse(localStorage.getItem("loroStatsV3")||'{"plays":0,"answered":0,"correct":0,"reviewDone":0}');$("plays").textContent=s.plays;$("answeredTotal").textContent=s.answered;$("accuracy").textContent=s.answered?Math.round(s.correct/s.answered*100)+"%":"0%";$("reviewDone").textContent=s.reviewDone}
function schedules(){return JSON.parse(localStorage.getItem("loroReviewSchedules")||"[]")} function saveSchedules(v){localStorage.setItem("loroReviewSchedules",JSON.stringify(v))}
function renderReviews(){const due=schedules().filter(x=>x.date<=todayKey()&&!x.done),box=$("reviewList");box.innerHTML="";if(!due.length){box.innerHTML='<div class="status">오늘 예약된 복습이 없습니다.</div>';return}due.forEach(x=>{const b=document.createElement("button");b.className="review-card";b.innerHTML=`<div><strong>DAY ${String(x.day).padStart(2,"0")}</strong><small>${x.date} 예약</small></div><span>복습 시작 →</span>`;b.onclick=()=>{state.reviewSchedule=x;start("normal",x.day)};box.appendChild(b)})}
function start(mode="normal",reviewDay=null){let pool;state.isReview=reviewDay!==null;if(mode==="wrong"){const saved=JSON.parse(localStorage.getItem("loroWrongV3")||"[]");pool=entries.filter(x=>saved.includes(keyOf(x)));if(pool.length<4)return alert("오답 항목이 4개 이상 필요합니다.")}else if(reviewDay!==null)pool=entries.filter(x=>x.day===reviewDay);else pool=state.selected==="all"?entries:entries.filter(x=>String(x.day)===String(state.selected));if(pool.length<4)return alert("해당 범위의 단어가 4개 미만입니다.");state.quiz=shuffle(pool);state.index=0;state.score=0;state.wrong=[];state.activeDay=reviewDay!==null?reviewDay:(state.selected==="all"?null:Number(state.selected));$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");showQuestion()}
function dir(){return state.mode==="random"?(Math.random()<.5?"en-ko":"ko-en"):state.mode}
function distractors(q,d){const p=shuffle(entries.filter(x=>keyOf(x)!==keyOf(q)&&x.pos===q.pos)),o=[];for(const x of p){const v=d==="en-ko"?x.meaning:x.word;if(!o.includes(v))o.push(v);if(o.length===3)break}return o}
function showQuestion(){const q=state.quiz[state.index],d=dir();state.currentDirection=d;$("nextBtn").classList.add("hidden");$("feedback").textContent="";$("counter").textContent=`${state.index+1} / ${state.quiz.length}`;$("score").textContent=`점수 ${state.score}`;$("progress").style.width=`${state.index/state.quiz.length*100}%`;$("direction").textContent=d==="en-ko"?"영어를 보고 한국어 뜻을 고르세요":"한국어 뜻을 보고 영어 단어를 고르세요";$("prompt").textContent=d==="en-ko"?q.word:q.meaning;$("pos").textContent=q.pos;const correct=d==="en-ko"?q.meaning:q.word,choices=shuffle([correct,...distractors(q,d)]);$("options").innerHTML="";choices.forEach(c=>{const b=document.createElement("button");b.className="option";b.textContent=c;b.onclick=()=>answer(b,c,q,correct);$("options").appendChild(b)})}
function answer(b,c,q,correct){document.querySelectorAll(".option").forEach(x=>x.disabled=true);if(c===correct){b.classList.add("correct");state.score++;$("feedback").textContent="✅ 정답입니다!"}else{b.classList.add("wrong");document.querySelectorAll(".option").forEach(x=>{if(x.textContent===correct)x.classList.add("correct")});$("feedback").textContent=`❌ 정답: ${correct}`;state.wrong.push(q);const s=new Set(JSON.parse(localStorage.getItem("loroWrongV3")||"[]"));s.add(keyOf(q));localStorage.setItem("loroWrongV3",JSON.stringify([...s]))}$("score").textContent=`점수 ${state.score}`;$("nextBtn").classList.remove("hidden")}
function nextQuestion(){state.index++;state.index>=state.quiz.length?finish():showQuestion()}
function finish(){const s=JSON.parse(localStorage.getItem("loroStatsV3")||'{"plays":0,"answered":0,"correct":0,"reviewDone":0}');s.plays++;s.answered+=state.quiz.length;s.correct+=state.score;if(state.isReview)s.reviewDone++;localStorage.setItem("loroStatsV3",JSON.stringify(s));if(state.isReview&&state.reviewSchedule){const all=schedules(),f=all.find(x=>x.id===state.reviewSchedule.id);if(f)f.done=true;saveSchedules(all)}$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("resultScore").textContent=`${state.score} / ${state.quiz.length}`;$("resultText").textContent=`정답률 ${Math.round(state.score/state.quiz.length*100)}%`;$("reviewScheduler").classList.toggle("hidden",state.activeDay===null||state.isReview);$("wrongList").innerHTML=state.wrong.length?state.wrong.map(x=>`<div class="wrong-item"><div class="wrong-main"><strong>${x.word}</strong><small>${x.pos}</small></div><span>${x.meaning}</span></div>`).join(""):"<div class='status'>모든 항목을 맞혔어요.</div>";stats()}
function saveReview(){if(state.activeDay===null)return;const days=[...document.querySelectorAll('#reviewScheduler input:checked')].map(x=>Number(x.value)),all=schedules();days.forEach(n=>all.push({id:`${Date.now()}-${n}`,day:state.activeDay,date:addDays(n),done:false}));saveSchedules(all);alert("복습 일정이 저장되었습니다.");renderReviews()}
function home(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");renderReviews();stats()}
$("startBtn").onclick=()=>start();$("wrongBtn").onclick=()=>start("wrong");$("nextBtn").onclick=nextQuestion;$("homeBtn").onclick=home;$("againBtn").onclick=()=>start();$("resultHomeBtn").onclick=home;$("saveReviewBtn").onclick=saveReview;$("resetBtn").onclick=()=>{if(confirm("학습 기록, 오답, 복습 일정을 모두 초기화할까요?")){["loroStatsV3","loroWrongV3","loroReviewSchedules"].forEach(k=>localStorage.removeItem(k));stats();renderReviews()}};
renderMode();stats();loadEntries();
</script>
</body></html>

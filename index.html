<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#86B27B">
  <title>Loro Vocab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L</div>
        <span>Loro Vocab</span>
      </div>
      <button id="resetBtn" class="icon-btn" type="button" aria-label="기록 초기화">↻</button>
    </header>

    <section id="home" class="panel">
      <div class="hero">
        <div class="pill">🌿 Google Sheet 연동</div>
        <h1>보고, 풀고,<br>원하는 Day를 복습해요.</h1>
        <p>단어 보기 → 퀴즈 → 복습 예약 → Weekly 기록까지 한 번에 관리합니다.</p>
      </div>

      <h2 class="section-title">학습할 Day</h2>
      <div id="dayGrid" class="day-grid"></div>

      <h2 class="section-title">퀴즈 모드</h2>
      <div class="mode-grid">
        <button class="mode-btn" data-mode="en-ko" type="button">
          <strong>영어 → 한국어</strong>
          <span>영단어 뜻 고르기</span>
        </button>
        <button class="mode-btn" data-mode="ko-en" type="button">
          <strong>한국어 → 영어</strong>
          <span>뜻에 맞는 단어 고르기</span>
        </button>
        <button class="mode-btn" data-mode="random" type="button">
          <strong>랜덤</strong>
          <span>두 방향 섞어서 출제</span>
        </button>
      </div>

      <div class="actions three">
        <button id="viewBtn" class="secondary" type="button">단어 보기</button>
        <button id="startBtn" class="primary" type="button">퀴즈 시작</button>
        <button id="wrongBtn" class="secondary" type="button">오답 복습</button>
      </div>

      <h2 class="section-title">오늘 복습</h2>
      <div id="reviewList" class="review-list"></div>

      <h2 class="section-title">이번 주 학습</h2>
      <div id="weeklyList" class="weekly-list"></div>

      <div class="stats">
        <div class="stat"><strong id="plays">0</strong><span>학습 횟수</span></div>
        <div class="stat"><strong id="answeredTotal">0</strong><span>푼 문제</span></div>
        <div class="stat"><strong id="accuracy">0%</strong><span>누적 정답률</span></div>
        <div class="stat"><strong id="reviewDone">0</strong><span>복습 완료</span></div>
      </div>

      <div id="sheetStatus" class="status">구글시트에서 단어를 불러오는 중입니다…</div>
    </section>

    <section id="viewer" class="panel hidden">
      <div class="quiz-meta">
        <span id="viewerCounter"></span>
        <span id="viewerDay"></span>
      </div>

      <div class="viewer-card">
        <div id="viewerWord" class="viewer-word"></div>
        <div id="viewerPos" class="pos-badge"></div>
        <div id="viewerMeaning" class="viewer-meaning"></div>
      </div>

      <div class="viewer-actions">
        <button id="prevCardBtn" class="secondary" type="button">← 이전</button>
        <button id="nextCardBtn" class="primary" type="button">다음 →</button>
      </div>
      <button id="viewerQuizBtn" class="secondary full top-gap" type="button">이 Day 퀴즈 시작</button>
      <button id="viewerHomeBtn" class="secondary full top-gap" type="button">메인으로</button>
    </section>

    <section id="quiz" class="panel hidden">
      <div class="progress-track">
        <div id="progress" class="progress-bar"></div>
      </div>
      <div class="quiz-meta">
        <span id="counter"></span>
        <span id="score"></span>
      </div>

      <div class="question-card">
        <div id="direction" class="direction"></div>
        <div id="prompt" class="prompt"></div>
        <div id="pos" class="pos-badge"></div>
      </div>

      <div id="options" class="options"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>

      <button id="nextBtn" class="primary full hidden" type="button">다음 문제</button>
      <button id="quitBtn" class="secondary full top-gap" type="button">학습 종료</button>
    </section>

    <section id="result" class="panel hidden">
      <div class="pill">🎉 학습 완료</div>
      <div id="resultScore" class="result-score"></div>
      <div id="resultText" class="result-sub"></div>

      <div id="reviewScheduler">
        <h2 class="section-title">이 Day를 언제 복습할까요?</h2>
        <div class="checks">
          <label><input type="checkbox" value="1" checked> 내일</label>
          <label><input type="checkbox" value="3"> 3일 후</label>
          <label><input type="checkbox" value="7"> 7일 후</label>
        </div>
        <button id="saveReviewBtn" class="secondary full" type="button">복습 일정 저장</button>
      </div>

      <h2 class="section-title">틀린 항목</h2>
      <div id="wrongList" class="wrong-list"></div>

      <div class="actions">
        <button id="againBtn" class="primary" type="button">같은 범위 다시</button>
        <button id="resultHomeBtn" class="secondary" type="button">메인으로</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
